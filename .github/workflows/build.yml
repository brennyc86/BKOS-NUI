name: Build Firmware

on:
  push:
    branches: [main]
    paths:
      - 'BKOS_NUI/**.ino'
      - 'BKOS_NUI/**.h'
      - 'BKOS_NUI/**.cpp'
      - 'BKOS_NUI/**.c'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build_esp32s3:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install ESP32 platform (core 2.x)
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17

      - name: Install libraries
        run: |
          arduino-cli lib install "GFX Library for Arduino@1.3.7"
          arduino-cli lib install "WiFiManager@2.0.17"
          arduino-cli lib install "TAMC_GT911@1.0.2"
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "WebSockets"

      - name: Compile ESP32-S3 firmware
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:CDCOnBoot=default,PartitionScheme=default_8MB,FlashSize=16M,FlashMode=dio,PSRAM=opi" \
            --library BKOS_NUI/libraries/LuaBKOS \
            --output-dir build_esp32s3/ \
            BKOS_NUI/

      - name: Commit ESP32-S3 firmware
        run: |
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          mkdir -p firmware
          cp build_esp32s3/BKOS_NUI.ino.bin firmware/bkos_esp32s3_8048s070.bin
          VERSION=$(sed -n 's/.*BKOS_NUI_VERSIE[[:space:]]*"\(.*\)".*/\1/p' BKOS_NUI/ota.h)
          echo "$VERSION" > firmware/versie_esp32s3.txt
          git add firmware/bkos_esp32s3_8048s070.bin firmware/versie_esp32s3.txt
          git diff --staged --quiet && exit 0
          git commit -m "ci: ESP32-S3 firmware $VERSION"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            echo "Push poging $i mislukt, opnieuw..."
            sleep $((RANDOM % 10 + 5))
          done

  build_wroom:
